name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: cmd
    attributes:
      label: The command
      description: The exact command, and the output of `agent-sudo --explain` on it if it was blocked or allowed wrongly.
      render: sh
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `agent-sudo --status`
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agent-sudo --version`
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distro and shell
